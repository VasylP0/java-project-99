
spring:
  application:
    name: app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

app:
  jwt:
    secret: ${JWT_SECRET:hexlet-development-only-jwt-secret-2026-change-in-production}
sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: false